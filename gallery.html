<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Besidevalley – Gallery</title>
<style>
html,body{margin:0;height:100%;background:#1b1511;color:#f2e8d8;font:14px/1.3 "Trebuchet MS",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{display:grid;height:100%;box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
grid-template-rows:auto minmax(170px,42%) auto 1fr;grid-template-areas:"tabs" "stage" "info" "panel"}
@media (orientation:landscape) and (max-height:560px){#app{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"tabs tabs" "stage panel" "info panel"}}
#tabs{grid-area:tabs;display:flex;gap:4px;padding:4px;overflow-x:auto;background:#0d0907}
#tabs button{flex:0 0 auto;min-height:44px;padding:0 12px;border:0;border-radius:8px;background:#2a2019;color:#e0c88a;font:inherit;font-weight:700}
#tabs button.on{background:#ffb43a;color:#1b1511}
#tabs i{font-style:normal;background:#d8352a;color:#fff;border-radius:9px;padding:0 6px;margin-left:5px;font-size:12px}
#stage{grid-area:stage;position:relative;overflow:hidden;min-height:0}
#cv{position:absolute;inset:0}
#cv canvas{display:block;width:100%;height:100%;touch-action:none}
#tint{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;background:#fff;transition:background .3s}
#tint.night{background:#5a6ca8}
#tools{position:absolute;top:6px;right:6px;display:flex;gap:6px}
#tools button,#rar button{min-width:44px;min-height:44px;border:0;border-radius:8px;background:rgba(13,9,7,.75);color:#fff;font:inherit;font-weight:700}
#iconBox{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
#iconBox canvas{width:128px;height:128px;image-rendering:pixelated}
#rar{position:absolute;left:6px;bottom:6px;display:none;gap:6px}
#info{grid-area:info;padding:6px 10px;background:#0d0907;font-size:13px;min-height:34px}
#info b{color:#ffb43a}#info .bad{color:#ff6a6a;font-weight:700}
#panel{grid-area:panel;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px;touch-action:pan-y;min-height:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px}
.card{background:#2a2019;border:2px solid #0d0907;border-radius:8px;padding:8px;min-height:56px;cursor:pointer}
.card.sel{border-color:#ffb43a}.card.over{border-color:#d8352a}
.card b{display:block;word-break:break-all}.card small{color:#c9b48a}.card canvas{float:right;image-rendering:pixelated;width:40px;height:40px}
.card .w{color:#ff6a6a;font-weight:700}
h3{margin:12px 0 6px;font-size:14px;color:#ffb43a}
.rr{display:flex;align-items:center;gap:6px;margin:3px 0}
.rr span{width:92px;font-size:12px;color:#c9b48a;flex:0 0 auto}
.sw{width:34px;height:34px;border-radius:4px;border:1px solid #000;flex:0 0 auto}
.sm{display:inline-block;width:16px;height:16px;border-radius:3px;border:1px solid #000;vertical-align:middle;margin-right:4px}
details{background:#2a2019;border-radius:6px;padding:6px 8px;margin:4px 0}summary{min-height:32px;line-height:32px}
.btn{min-height:44px;padding:0 14px;border:0;border-radius:8px;background:#ffb43a;color:#1b1511;font:inherit;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
.ok{color:#5fe05f}
</style>
</head>
<body>
<div id="app">
  <div id="tabs"></div>
  <div id="stage"><div id="cv"></div><div id="tint"></div><div id="iconBox"></div>
    <div id="tools"><button id="bDay" type="button">☀</button><button id="bRef" type="button">Tỉ lệ</button></div>
    <div id="rar"></div></div>
  <div id="info">Chạm một mục để xem; chạm lần nữa để chép id.</div>
  <div id="panel"></div>
</div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/assets.js"></script>
<script src="js/palette.js"></script>
<script src="js/rig.js"></script>
<script src="js/items.js"></script>
<script src="js/icons.js"></script>
<script src="js/player.js"></script>
<script src="js/enemies.js"></script>
<script src="js/boss.js"></script>
<script src="js/dungeon.js"></script>
<script src="gallery.js"></script>
</body>
</html>
