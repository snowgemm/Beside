<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Besidevalley: Dungeons</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game"></div>
<div id="touch"></div>
<div id="joy"><div id="joy-knob"></div></div>
<div id="hud">FPS --</div>
<div id="hp"><div id="hp-fill"></div><span id="hp-text">100/100</span></div>
<div id="fade"></div>
<div id="room-hud"></div>
<div id="boss-bar"><div id="boss-fill"></div><span id="boss-name"></span></div>
<div id="inv"></div>
<div id="toasts"></div>
<div id="hint">Nhấp để chơi<br><small>WASD: di chuyển · Space: nhảy · V: đổi góc nhìn</small></div>
<button id="btn-view" type="button">Góc nhìn</button>
<button id="btn-attack" type="button">Đánh</button>
<button id="btn-dodge" type="button">Lăn</button>
<button id="btn-bag" type="button">Túi</button>
<button id="btn-jump" type="button">Nhảy</button>
<button id="btn-interact" type="button"></button>
<button id="btn-build" type="button">Xây</button>
<button id="btn-break" type="button">Phá</button>
<button id="btn-place" type="button">Đặt</button>
<button id="btn-menu" type="button">⚙</button>
<div id="menu"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="js/assets.js"></script>
<script src="js/save.js"></script>
<script src="js/world.js"></script>
<script src="js/player.js"></script>
<script src="js/input.js"></script>
<script src="js/combat.js"></script>
<script src="js/enemies.js"></script>
<script src="js/items.js"></script>
<script src="js/inventory.js"></script>
<script src="js/rooms.js"></script>
<script src="js/dungeon.js"></script>
<script src="js/boss.js"></script>
<script src="js/minimap.js"></script>
<script src="js/build.js"></script>
<script src="js/menu.js"></script>
<script src="js/main.js"></script>
</body>
</html>
