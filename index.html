<html lang="vi">
<head>

<title>Besidevalley: Dungeons</title>

<body>
<div id="game"></div>
<div id="touch"></div>
<div id="joy"><div id="joy-knob"></div></div>
<div id="hud">FPS --</div>
<div id="coords" aria-live="off">X 0.0 · Y 0.0 · Z 0.0</div>
<div id="profile-tools" hidden role="group" aria-label="Công cụ đo hiệu năng">
  <span id="profile-status" aria-live="polite">0 mẫu</span>
  <button id="profile-capture" type="button">Chụp mẫu</button>
  <button id="profile-export" type="button">Xuất JSON</button>
  <button id="profile-clear" type="button" aria-label="Xóa mẫu">Xóa</button>
</div>
<div id="hudL"><div id="wpn" class="empty"></div><div id="hp"><div id="hp-ghost"></div><div id="hp-fill"></div><div id="hp-seg"></div><span id="hp-text">100/100</span></div></div>
<div id="fade"></div>
<div id="room-hud"><b id="rh-room"></b><span id="rh-foes"></span></div>
<div id="boss-bar"><div id="boss-fill"></div><i class="tick" style="left:50%"></i><span id="boss-name"></span></div>
<div id="inv"></div>
<div id="toasts"></div>
<div id="banner"><div id="bn-t"></div><div id="bn-s"></div></div>
<div id="death"><div class="d-box"><div class="d-t">Bạn đã gục ngã</div><button id="d-btn" class="primary" type="button">Hồi sinh</button></div></div>
<div id="title"></div>
<div id="hint">Nhấp để chơi<br><small>WASD: di chuyển · Space: nhảy · V: đổi góc nhìn</small></div>
<button id="btn-view" type="button">Góc nhìn</button>
<button id="btn-attack" type="button">Đánh</button>
<button id="btn-dodge" type="button">Lăn</button>
<button id="btn-bag" type="button">Túi</button>
<button id="btn-jump" type="button">Nhảy</button>
<button id="btn-interact" type="button"></button>
<button id="btn-menu" type="button">⚙</button>
<div id="menu"></div>
