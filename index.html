<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#9fd8f0">
<title>Thung Lũng Làng</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" data-phase="day"><span id="hud-day"></span><span id="hud-time"></span></div>
<div id="joy"><div id="joy-knob"></div></div>
<button id="act" type="button">Dùng</button>
<div id="loading">Đang mở cổng làng…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/assets.js"></script>
<script src="js/models.js"></script>
<script src="js/player.js"></script>
<script src="js/inventory.js"></script>
<script src="js/farm.js"></script>
<script src="js/resources.js"></script>
<script src="js/crafting.js"></script>
<script src="js/sfx.js"></script>
<script src="js/ui.js"></script>
<script src="js/fishing.js"></script>
<script>
// Start once the props are placed (so collision is final), but never wait more than 6 s on a slow connection.
Promise.race([Game.Models.ready, new Promise(function (r) { setTimeout(r, 6000); })]).then(function () { Game.start(); });
</script>
</body>
</html>
