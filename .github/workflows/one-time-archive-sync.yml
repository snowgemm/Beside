name: One-time dungeon archive sync
on:
  push:
    branches:
      - main
    paths:
      - ".sync/part*.b64"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract and validate archive
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat .sync/part*.b64 | base64 --decode | tar -xJf - -C "$tmp"
          test -f "$tmp/index.html"
          test -f "$tmp/viewer.html"
          test -f "$tmp/STATE.md"
          test -f "$tmp/js/enemies.js"
          test -f "$tmp/js/fx.js"
          test -f "$tmp/js/sky.js"
          test "$(find "$tmp" -type f | wc -l)" -eq 26
          for f in "$tmp"/js/*.js; do node --check "$f"; done
      - name: Sync archive while retaining camera fix
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat .sync/part*.b64 | base64 --decode | tar -xJf - -C "$tmp"
          while IFS= read -r -d '' f; do
            rel="${f#"$tmp"/}"
            if [ "$rel" = "js/player.js" ]; then
              continue
            fi
            install -D "$f" "$rel"
          done < <(find "$tmp" -type f -print0)
          rm -rf .sync
          rm -f .github/workflows/one-time-archive-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sync expanded dungeon gameplay and world systems"
          git push origin HEAD:main
