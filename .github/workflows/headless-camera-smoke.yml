name: Headless camera smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  headless-camera:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run JavaScript syntax and headless camera checks
        run: node tests/headless-camera-smoke.cjs
      - name: Verify immutable model cache migration
        run: node tests/model-cache-migration.cjs
      - name: Audit pinned GLB topology and texture budgets
        run: node tests/glb-asset-audit.cjs
      - name: Upload GLB audit report
        uses: actions/upload-artifact@v4
        with:
          name: beside-glb-audit
          path: asset-audit-report.json
          if-no-files-found: error
          retention-days: 30
