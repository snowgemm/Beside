name: Headless camera smoke test

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  headless-camera:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Run JavaScript syntax and headless camera checks
        run: node tests/headless-camera-smoke.cjs
      - name: Verify immutable model cache migration
        run: node tests/model-cache-migration.cjs
      - name: Verify audited model texture sharing
        run: node tests/model-texture-sharing.cjs
      - name: Audit pinned GLB topology and texture budgets
        run: node tests/glb-asset-audit.cjs
      - name: Upload GLB audit report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beside-glb-audit
          path: asset-audit-report.json
          if-no-files-found: error
          retention-days: 30
